schema = 1
name = "Slot box in a wire lane"
kind = "element"
status = "unverified"
reference = { standard = "IEC 60617", number = "S00001" }

ports = [
  { id = "in",  at = [0, -2], dir = "N" },
  { id = "out", at = [0, 2],  dir = "S" },
]

elements = [
  { line = [[0, -2], [0, -1]] },
  { line = [[0, 2], [0, 1]] },
]

# The first box straddles the lane of "in"; the second sits 0.25 M beside the wire and only
# touches its lane, which is fine.
[slots]
"marking.in"  = { at = [-0.5, -3],  side = "E", box = [1.5, 1] }
"marking.out" = { at = [0.25, 1.5], side = "E", box = [1.5, 1] }
