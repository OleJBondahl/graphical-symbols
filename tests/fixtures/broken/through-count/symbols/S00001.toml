schema = 1
name = "Two through paths"
kind = "element"
status = "unverified"
reference = { standard = "IEC 60617", number = "S00001" }

# Every through path runs from (0, -a) N to (0, a) S, so a second one that is not also wrong on
# the axis must use the same two nodes: this fixture unavoidably breaks path-invalid as well.
ports = [
  { id = "in",   at = [0, -2], dir = "N" },
  { id = "in2",  at = [0, -2], dir = "N" },
  { id = "out",  at = [0, 2],  dir = "S" },
  { id = "out2", at = [0, 2],  dir = "S" },
]

nodes = [
  { ports = ["in", "in2"] },
  { ports = ["out", "out2"] },
]

paths = [
  { from = "in",  to = "out",  kind = "conductor", through = true },
  { from = "in2", to = "out2", kind = "conductor", through = true },
]

elements = [
  { line = [[0, -2], [0, -1]] },
  { line = [[0, 2], [0, 1]] },
]
