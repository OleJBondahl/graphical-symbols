schema = 1
name = "Nodes naming an unknown port and listing a port twice"
kind = "element"
status = "unverified"
reference = { standard = "IEC 60617", number = "S00001" }

ports = [
  { id = "in",  at = [0, -2], dir = "N" },
  { id = "out", at = [0, 2],  dir = "S" },
]

# "ghost" is no port, and "out" is listed by both nodes.
nodes = [
  { ports = ["in", "out"] },
  { ports = ["out", "ghost"] },
]

elements = [
  { line = [[0, -2], [0, -1]] },
  { line = [[0, 2], [0, 1]] },
]
