# Clean in the base orientation, broken in others: slot boxes do not rotate with the symbol.
# In R0 the box stands above (1, 0), x in [0.25, 1.75], y in [-3, 0], beside the upper lead. After
# R90 it stands at x in [0, 1.5], y in [-0.5, 2.5] and lies across the lead that moved to
# (1, 0)-(2, 0), still clear of the wire lanes.
schema = 1
name = "Slot box that lands on a lead when turned"
kind = "element"
status = "unverified"
reference = { standard = "IEC 60617", number = "S00002" }

ports = [
  { id = "in",  at = [0, -2], dir = "N" },
  { id = "out", at = [0, 2],  dir = "S" },
]

paths = [
  { from = "in", to = "out", kind = "conductor" },
]

elements = [
  { line = [[0, -2], [0, -1]] },
  { line = [[0, 2], [0, 1]] },
]

[slots]
value = { at = [1, 0], side = "N", box = [1.5, 3] }
